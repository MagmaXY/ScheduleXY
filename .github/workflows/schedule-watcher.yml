name: Check Lyceum Schedule Changes & Update Cache

on:
  schedule:
    # Run every 5 minutes (maximum frequency supported by GitHub Actions) 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Fetch Lyceum Schedule & Check Changes
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          node scripts/sync-schedule.js

      - name: Commit & push updated schedule data if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/public/data/
          if git diff --staged --quiet; then
            echo "No schedule updates to commit."
          else
            git commit -m "chore: auto-update schedule cache data [skip ci]"
            git push origin main
          fi

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web App
        working-directory: ./web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
