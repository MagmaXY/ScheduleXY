name: Check Lyceum Schedule Changes & Send Push

on:
  schedule:
    # Run every 30 minutes from 06:00 to 20:00 MSK (03:00 to 17:00 UTC) on weekdays
    - cron: '*/30 3-17 * * 1-6'
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check schedule changes and notify via OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          node - << 'EOF'
          const https = require('https');

          const ONESIGNAL_APP_ID = process.env.ONESIGNAL_APP_ID;
          const ONESIGNAL_API_KEY = process.env.ONESIGNAL_API_KEY;

          if (!ONESIGNAL_APP_ID || !ONESIGNAL_API_KEY) {
            console.log('OneSignal secrets not configured yet. Skipping push check.');
            process.exit(0);
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch (e) { resolve(null); }
                });
              }).on('error', reject);
            });
          }

          function sendPush(className, message) {
            const payload = JSON.stringify({
              app_id: ONESIGNAL_APP_ID,
              filters: [
                { field: 'tag', key: 'class', relation: '=', value: className }
              ],
              headings: { en: 'Лицей НГТУ — Изменение расписания', ru: 'Лицей НГТУ — Изменение расписания' },
              contents: { en: message, ru: message }
            });

            const req = https.request('https://onesignal.com/api/v1/notifications', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Basic ${ONESIGNAL_API_KEY}`
              }
            }, (res) => {
              console.log(`Push sent for ${className}: status ${res.statusCode}`);
            });
            req.write(payload);
            req.end();
          }

          async function main() {
            console.log('Schedule watcher ready.');
          }

          main();
          EOF
