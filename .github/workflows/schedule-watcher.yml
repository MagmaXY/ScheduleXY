name: Check Lyceum Schedule Changes & Update Cache

on:
  schedule:
    # Run every 5 minutes (maximum frequency supported by GitHub Actions) 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "schedule-watcher"
  cancel-in-progress: true

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.sync_check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Fetch Lyceum Schedule & Check Changes
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          node scripts/sync-schedule.js

      - name: Commit & push updated schedule data if changed
        id: sync_check
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/public/data/
          if git diff --staged --quiet -- ':!web/public/data/meta.json'; then
            echo "No schedule data updates to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-update schedule cache data [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.sync_check.outputs.changed == 'true'
        working-directory: ./web
        run: npm ci

      - name: Build Web App
        if: steps.sync_check.outputs.changed == 'true'
        working-directory: ./web
        run: npm run build

      - name: Setup Pages
        if: steps.sync_check.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.sync_check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: needs.sync-and-build.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
